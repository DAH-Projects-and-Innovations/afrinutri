name: afrinutri
description: Assistant Nutritionnel Intelligent pour l'Afrique — Data Afrique Hub
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.0.0

  # Gestion d'état
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # HTTP Client
  dio: ^5.4.0

  # Stockage sécurisé du token JWT
  flutter_secure_storage: ^9.0.0

  # Images
  cached_network_image: ^3.3.0
  image_picker: ^1.1.0

  # UI
  google_fonts: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/